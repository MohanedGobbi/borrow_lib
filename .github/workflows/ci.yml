name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Translations have the same keys in EN, FR and AR
        run: node scripts/check-i18n.mjs
      - name: Build (real backend)
        run: npm run build
      - name: Build (Vercel demo)
        run: npm run build:demo

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test library
      - name: Production settings pass the deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz0123456789
          DJANGO_ALLOWED_HOSTS: api.example.edu
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level ERROR

  backend-postgres:
    # SQLite ignores row locks; PostgreSQL enforces them, so the circulation rules run here too.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: libborrow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: libborrow
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply on PostgreSQL
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test library

  e2e:
    # One Playwright suite against both targets: the in-browser demo API and the real Django API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
