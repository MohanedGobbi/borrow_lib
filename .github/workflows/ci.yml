name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build (real backend)
        run: npm run build
      - name: Build (Vercel demo)
        run: npm run build:demo

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test library
      - name: Production settings pass the deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz0123456789
          DJANGO_ALLOWED_HOSTS: api.example.edu
          STAFF_INVITE_CODE: ci
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level ERROR
