name: Release

# Publishes a version that servers with automatic updates install on their own (deploy/auto-update.sh).
# To release:  npm version patch   (or minor / major: it bumps package.json, commits and tags vX.Y.Z)
#              git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: The tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME, but package.json says $expected"; exit 1; }

      # A release reaches the library's server without anyone checking it there: test it first.
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-i18n.mjs
      - run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test library
      - name: Server scripts parse
        run: for f in deploy/*.sh deploy/package/*.sh; do bash -n "$f"; done

      - name: Build the server package
        run: python scripts/make_release.py --out release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/lib-borrow-*.tar.gz release/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
