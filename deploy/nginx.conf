# The library site: nginx serves the built React app, uploads and admin assets itself and
# hands /api/ and /admin/ to gunicorn. One origin for everything, as the sign-in cookie needs.
# Installed to /etc/nginx/sites-available/lib-borrow by deploy/install.sh.
# TLS: `certbot --nginx -d <domain>` adds the 443 server and the redirect to this file.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAMES@;

    root @APP_DIR@/dist;
    index index.html;

    # Book imports, backups to restore and site photographs are uploaded through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Uploads (covers, site photographs) and the Django admin's own CSS/JS.
    location /media/ {
        alias @DATA_DIR@/media/;
        expires 7d;
    }
    location /static/ {
        alias @DATA_DIR@/static/;
        expires 30d;
    }

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /models/ {
        expires 7d;
        try_files $uri =404;
    }

    # Never cache the entry page: it names the current /assets/ files.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths (/books/12, /staff/loans …) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
